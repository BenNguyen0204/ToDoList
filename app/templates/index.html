<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/variables.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/base.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/sidebar.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/app.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/tasks.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/toast.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/welcome.css') }}" />
    <title>To-do List</title>
</head>

<body>
    <div class="sidebar" id="sidebar">
        <div class="sidebarHeader">
            <h2>My Lists</h2>
            <button id="newListButton">+</button>
        </div>
        <ul id="listTabs"></ul>

        <div class="sidebarFooter">
            {# flask-login makes current_user available in every template #}
            <span class="username" title="{{ current_user.username }}">{{ current_user.username }}</span>
            {# a form so logout is a POST, see auth.py #}
            <form method="post" action="{{ url_for('auth.logout') }}">
                <button type="submit" class="logoutButton">Log out</button>
            </form>
        </div>
    </div>

    <div class="main">
        <div class="app">
            <div class="topBar">
                <h1 id="listTitle">To-Do List</h1>
                <div class="buttons">
                    <div class="filterDropdown" id="filterDropdown">
                        <button id="filterToggle">
                            <img src="{{ url_for('static', filename='images/filter.png') }}" alt="Filter" />
                        </button>
                        <div class="filterMenu" id="filterMenu">
                            <label><input type="radio" name="filter" value="all" checked /> All</label>
                            <label><input type="radio" name="filter" value="active" /> Active</label>
                            <label><input type="radio" name="filter" value="completed" /> Completed</label>
                        </div>
                    </div>
                    <div class="filterDropdown" id="sortDropdown">
                        <button id="sortToggle">
                            <img src="{{ url_for('static', filename='images/sort.svg') }}" alt="Sort" />
                        </button>
                        <div class="filterMenu" id="sortMenu">
                            <label><input type="radio" name="sort" value="manual" checked /> Manual order</label>
                            <label><input type="radio" name="sort" value="earliest" /> Earliest due date</label>
                            <label><input type="radio" name="sort" value="latest" /> Latest due date</label>
                            <label><input type="radio" name="sort" value="color" /> By color</label>
                        </div>
                    </div>
                    <button id="themeButton" class="themeButton">
                        <img src="{{ url_for('static', filename='images/darkMode.png') }}" alt="Theme Button" />
                    </button>
                </div>
            </div>

            <div class="inputRow">
                <input type="text" id="taskInput" placeholder="Enter a task" />
                <div class="newTaskOptions">
                    <button id="newTaskColorButton" class="colorButton empty" title="Set color"
                        aria-label="Set task color"></button>
                    <button id="newTaskDateButton" class="dateButton empty">Set due date</button>
                    <button id="addButton">Add</button>
                </div>
            </div>

            <div class="taskCounter">
                <span id="totalCount">Total: 0</span>
                <span id="activeCount">Active: 0</span>
                <span id="completedCount">Completed: 0</span>
            </div>
        </div>

        <div class="welcomeState" id="welcomeState">
            <h2>Welcome to your To-Do List</h2>
            <p>Create a new list to get started</p>
            <button id="welcomeThemeButton" class="themeButton" aria-label="Toggle dark mode">
                <img src="{{ url_for('static', filename='images/darkMode.png') }}" alt="Theme Button" />
            </button>
        </div>

        <div class="tasksDiv">
            <ul id="tasksList"></ul>
            <div class="emptyState" id="emptyState">No tasks yet</div>
        </div>
    </div>

    <div class="toast" id="toast">
        <p id="toastMessage"></p>
        <div class="toastButtons">
            <button class="toastYes" id="toastYes">Yes</button>
            <button class="toastNo" id="toastNo">No</button>
        </div>
    </div>
    <div id="overlay" class="overlay"></div>

    <script src="{{ url_for('static', filename='scripts/storage.js') }}"></script>
    <script src="{{ url_for('static', filename='scripts/toast.js') }}"></script>
    <script src="{{ url_for('static', filename='scripts/pickers.js') }}"></script>
    <script src="{{ url_for('static', filename='scripts/controls.js') }}"></script>
    <script src="{{ url_for('static', filename='scripts/taskActions.js') }}"></script>
    <script src="{{ url_for('static', filename='scripts/taskRender.js') }}"></script>
    <script src="{{ url_for('static', filename='scripts/sidebar.js') }}"></script>
    <script src="{{ url_for('static', filename='scripts/theme.js') }}"></script>
    <script src="{{ url_for('static', filename='scripts/main.js') }}"></script>
</body>

</html>
